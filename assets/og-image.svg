<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">FutbolRadar</title>
  <desc id="desc">Canlı skor, form, momentum ve AI futbol analizi platformu.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071017"/>
      <stop offset="0.55" stop-color="#081b20"/>
      <stop offset="1" stop-color="#041012"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#80ff9b"/>
      <stop offset="1" stop-color="#4de5ff"/>
    </linearGradient>
    <pattern id="grid" width="96" height="84" patternUnits="userSpaceOnUse">
      <path d="M96 0H0V84" fill="none" stroke="#80ff9b" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="930" cy="220" r="210" fill="#4de5ff" fill-opacity="0.08"/>
  <circle cx="960" cy="250" r="130" fill="none" stroke="#80ff9b" stroke-opacity="0.38" stroke-width="3"/>
  <circle cx="960" cy="250" r="78" fill="none" stroke="#4de5ff" stroke-opacity="0.28" stroke-width="4"/>
  <path d="M960 250 820 100M960 250 1085 160M960 250 1045 385" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <rect x="88" y="84" width="76" height="76" rx="18" fill="#10262b" stroke="#80ff9b" stroke-width="3"/>
  <text x="126" y="133" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900" fill="#80ff9b">FR</text>
  <text x="188" y="132" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900" fill="#eef8f5">FutbolRadar</text>
  <text x="90" y="244" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" fill="#eef8f5">Maçları skordan önce</text>
  <text x="90" y="328" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" fill="#eef8f5">form ve momentumla oku.</text>
  <text x="94" y="404" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#b8cbc8">Canlı skor + son 5 maç formu + gol eğilimi + AI analiz</text>
  <rect x="92" y="462" width="238" height="58" rx="29" fill="url(#accent)"/>
  <text x="211" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#03100d">Radar Sinyalleri</text>
  <rect x="356" y="462" width="220" height="58" rx="29" fill="#0e1b22" stroke="#4de5ff" stroke-opacity="0.45"/>
  <text x="466" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#eef8f5">Momentum</text>
