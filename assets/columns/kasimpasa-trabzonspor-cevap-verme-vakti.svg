  <line x1="78" y1="432" x2="640" y2="432" stroke="#2f6ea8" stroke-opacity="0.6" stroke-width="2"/>

  <text x="78" y="486" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="600" fill="#9fb3c0">15 Ağustos 2026 · 19.00 · Recep Tayyip Erdoğan Stadyumu</text>

  <text x="78" y="556" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="28" font-weight="800" letter-spacing="2" fill="#4de5ff">futbolradar.com</text>
