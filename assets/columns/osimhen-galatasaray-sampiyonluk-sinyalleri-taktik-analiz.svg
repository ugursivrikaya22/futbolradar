  <line x1="78" y1="446" x2="640" y2="446" stroke="#a6192e" stroke-opacity="0.7" stroke-width="2"/>

  <text x="78" y="500" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
