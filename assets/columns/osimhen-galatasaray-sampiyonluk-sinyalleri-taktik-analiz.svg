<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Galatasaray - Göztepe | Osimhen Sadece Gol Atmıyor, Galatasaray'ın Oyununu Kuruyor</title>
  <desc id="desc">FutbolRadar köşe yazısı kapak görseli: Galatasaray 3-2 Göztepe, RAMS Park, 29 Ağustos 2026, Victor Osimhen performans analizi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#170a06"/>
      <stop offset="0.55" stop-color="#1c0f08"/>
      <stop offset="1" stop-color="#0c0603"/>
    </linearGradient>
    <linearGradient id="gsband" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a6192e"/>
      <stop offset="1" stop-color="#f6b40e"/>
    </linearGradient>
    <pattern id="grid" width="96" height="84" patternUnits="userSpaceOnUse">
      <path d="M96 0H0V84" fill="none" stroke="#f6b40e" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Saha yayı: maçın sahada oynandığını hatırlatan tek grafik öge. -->
  <circle cx="985" cy="300" r="235" fill="#a6192e" fill-opacity="0.12"/>
  <circle cx="985" cy="300" r="150" fill="none" stroke="#f6b40e" stroke-opacity="0.5" stroke-width="3"/>
  <circle cx="985" cy="300" r="92" fill="none" stroke="#a6192e" stroke-opacity="0.6" stroke-width="2"/>

  <rect x="0" y="0" width="10" height="630" fill="url(#gsband)"/>

  <text x="78" y="120" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
