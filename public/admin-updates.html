<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>FutbolRadar Güncelleme İzleme</title>
  <style>
    :root{color-scheme:dark;--bg:#07101d;--panel:#101d2e;--line:#263a51;--text:#edf5ff;--muted:#93a8be;--ok:#35d07f;--warn:#ffbd4a;--bad:#ff6675}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}.wrap{width:min(1120px,calc(100% - 32px));margin:34px auto}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}h1,h2{margin:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.value{font-size:24px;font-weight:750;margin-top:8px}.badge{display:inline-block;border-radius:999px;padding:4px 10px;font-weight:750}.success{background:#123b2a;color:var(--ok)}.partial,.skipped{background:#3c3115;color:var(--warn)}.failed{background:#451d27;color:var(--bad)}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:12px;text-transform:uppercase}.section{margin-top:18px}.empty{padding:18px 0;color:var(--muted)}@media(max-width:720px){.head{display:block}.head p{margin-bottom:0}.table-wrap{overflow:auto}}
  </style>
  <script data-futbolradar-theme>
    (function () {
      try {
        var stored = window.localStorage.getItem("futbolradar-theme");
        if (stored === "dark" || stored === "light") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (error) {
        /* localStorage kapalıysa sistem tercihi geçerli kalır. */
      }
    })();
  </script>
    <meta data-futbolradar-verification name="google-site-verification" content="1lqNuyji33r6_AcAJ26wxgpZGmq7BLsHwH43xKLZl8I">
  <!-- favicon:start -->
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<!-- favicon:end -->
    <script src="/analytics.js" defer data-futbolradar-ga4 data-ga4-id="" data-google-ads-id="" data-page-view-label="" data-match-click-label=""></script>
  </head>
<body>
<main class="wrap" id="data-update-monitor">
  <div class="head"><div><h1>Otomatik Güncelleme İzleme</h1><p class="muted">Europe/Istanbul · tam güncelleme 05:00 · saatlik güncelleme diğer saat başları</p></div><div id="updated" class="muted">Yükleniyor…</div></div>
  <section class="grid">
    <article class="card"><h2>Son çalışma</h2><div id="latest" class="value">—</div><div id="latest-time" class="muted"></div></article>
    <article class="card"><h2>Son tam güncelleme</h2><div id="full" class="value">—</div><div id="full-time" class="muted"></div></article>
    <article class="card"><h2>Son saatlik güncelleme</h2><div id="hourly" class="value">—</div><div id="hourly-time" class="muted"></div></article>
    <article class="card"><h2>Değişen dosya</h2><div id="files" class="value">0</div><div id="counts" class="muted"></div></article>
  </section>
  <section class="card section"><h2>Kaynak sorunları</h2><div id="source-issues" class="empty">Kaynak sorunu yok.</div></section>
  <section class="card section"><h2>Son çalışmalar</h2><div class="table-wrap"><table><thead><tr><th>Tür</th><th>Durum</th><th>Başlangıç</th><th>Süre</th><th>Değişiklik</th></tr></thead><tbody id="history"></tbody></table></div></section>
</main>
<script>
(function(){
  function esc(value){return String(value==null?"":value).replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];});}
  function time(value){if(!value)return "Henüz çalışmadı";var date=new Date(value);return isNaN(date.getTime())?String(value):new Intl.DateTimeFormat("tr-TR",{timeZone:"Europe/Istanbul",dateStyle:"medium",timeStyle:"medium"}).format(date);}
  function duration(ms){if(!Number.isFinite(Number(ms)))return "—";var seconds=Math.round(Number(ms)/1000);return seconds<60?seconds+" sn":Math.floor(seconds/60)+" dk "+seconds%60+" sn";}
  function badge(record){if(!record)return "—";var status=record.status||"unknown";return '<span class="badge '+esc(status)+'">'+esc(status)+'</span>';}
  function setRecord(prefix,record){document.getElementById(prefix).innerHTML=badge(record);document.getElementById(prefix+"-time").textContent=time(record&&(record.finishedAt||record.startedAt));}
  function render(data){
    var latest=data.lastUpdate||((data.history||[])[0])||null;
    document.getElementById("updated").textContent="Status: "+time(data.updatedAt);
    setRecord("latest",latest);setRecord("full",data.lastFull);setRecord("hourly",data.lastHourly);
    var counts=latest&&latest.counts||{};document.getElementById("files").textContent=counts.filesChanged||0;
    document.getElementById("counts").textContent="Maç "+(counts.matchesUpdated||0)+" · Haber "+(counts.newsUpdated||0)+" · Takım "+(counts.teamsUpdated||0)+" · Oyuncu "+(counts.playersUpdated||0);
    var issues=(latest&&latest.sourcesChecked||[]).filter(function(item){return item.status==="failed"||item.status==="skipped";});
    document.getElementById("source-issues").innerHTML=issues.length?'<table><thead><tr><th>Kaynak</th><th>Durum</th><th>Açıklama</th></tr></thead><tbody>'+issues.map(function(item){return "<tr><td>"+esc(item.source||item.id)+"</td><td>"+badge(item)+"</td><td>"+esc(item.error||item.reason||"Kaynak sorunu")+"</td></tr>";}).join("")+"</tbody></table>":'<div class="empty">Kaynak sorunu yok.</div>';
    document.getElementById("history").innerHTML=(data.history||[]).slice(0,20).map(function(item){return "<tr><td>"+esc(item.type)+"</td><td>"+badge(item)+"</td><td>"+esc(time(item.startedAt))+"</td><td>"+esc(duration(item.durationMs))+"</td><td>"+esc((item.counts&&item.counts.filesChanged)||0)+" dosya</td></tr>";}).join("")||'<tr><td colspan="5" class="empty">Henüz çalışma kaydı yok.</td></tr>';
  }
  function load(){fetch("/data/update-status.json",{cache:"no-store"}).then(function(response){if(!response.ok)throw new Error("HTTP "+response.status);return response.json();}).then(render).catch(function(error){document.getElementById("updated").textContent="Status okunamadı: "+error.message;});}
  load();setInterval(load,60000);
})();
</script>
</body>
</html>
