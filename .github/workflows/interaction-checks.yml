name: Interaction checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: interactions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  production:
    runs-on: ubuntu-latest
    # SÜRE SINIRI 45 → 75 DAKİKA.
    #
    # Koşu 45 dakikada KESİLDİ (run 35455733680, 19 Eylül): test düşmedi,
    # iş zaman aşımına uğradı — günlüğün sonunda `npm run build` ve
    # tıklanabilirlik denetiminin chrome-headless-shell süreci hâlâ
    # çalışırken "Terminate orphan process" satırları var.
    #
    # Derleme sınıra dayanmış durumda: 16 Eylül'de 36 dakika, 19 Eylül'de
    # 44 dakika 46 saniye (sınırın 14 saniye altında), sonraki koşuda 45
    # dakikayı aştı. Site büyüdükçe (sayfa sayısı, 109 adımlık test
    # zinciri, 365 senaryoluk tarayıcı denetimi) bu her koşuda olur ve
    # main'in kendi push'larını da keser.
    #
    # Sınır kaldırılmıyor, yalnızca gerçekliğe göre yükseltiliyor: takılan
    # bir koşu hâlâ kendiliğinden ölür.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # postbuild gates success on lint, types, all routes and real clicks.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clickable-audit
          path: |
            outputs/clickable/
            outputs/interaction-routes.json
          retention-days: 14
