name: Interaction checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: interactions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  production:
    runs-on: ubuntu-latest
    # The build regenerates the whole site (match pages, both news feeds,
    # every English page) and then runs verify-production with three
    # browser gates. On a 2-vCPU runner that grew past the old 45-minute
    # ceiling and the job started being cancelled mid-build — the gates
    # never reported, so the ceiling verified nothing. Nothing is skipped
    # here; the same checks are simply allowed to finish.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # TARAYICI ÖNBELLEĞİ. Chromium indirmesi her koşuda sıfırdan yapılıyordu
      # (~1-2 dakika × koşu başına). Sürüm anahtarı package-lock.json'dan
      # geliyor, yani Playwright yükseltilince önbellek kendiliğinden
      # tazeleniyor; --with-deps'in kurduğu sistem kütüphaneleri önbelleğe
      # girmediği için o adım her koşuda yine çalışıyor.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # postbuild gates success on lint, types, all routes and real clicks.
      #
      # GENİŞLİK KÜMESİ DALA GÖRE. Tıklanabilirlik denetimi dokuz genişlikte
      # 365 senaryo koşuyor ve koşu ~50 dakika sürüyor; private depoda her PR
      # push'u bunu baştan ödüyor. PR'da üç temsili genişlik koşuyor (mobil
      # 390, tablet 768, masaüstü 1440), main'e push'ta dokuzunun tamamı.
      #
      # Hiçbir senaryo atlanmıyor, gevşetilmiyor ya da karantinaya alınmıyor:
      # değişen tek şey PR'da kaç genişlikte tekrarlandığı. Bir dal tam taramayı
      # merge'den önce koşmak isterse "Run workflow" ile elle tetiklenen koşu
      # dokuz genişliği de koşar.
      - run: npm run build
        env:
          AUDIT_WIDTH: ${{ github.event_name == 'pull_request' && '390,768,1440' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clickable-audit
          path: |
            outputs/clickable/
            outputs/interaction-routes.json
          retention-days: 14
