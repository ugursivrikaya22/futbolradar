name: Interaction checks
on:
  pull_request:
  push:
    branches: [main]
    # Yalnızca veri ve doküman değiştiren main push'ları (kod, betik, HTML
    # şablonu, iş akışı yoksa) bu işi tetiklemez. Ölçüm (Grok, 21.09-16.10.2026):
    # 300 koşu ~9.963 dk; main push'ları %36'sı; yalnızca `data/` değişen 20
    # koşu 754 dk. Saatlik otomatik güncelleme zaten GITHUB_TOKEN ile commit'lenir
    # ve bu işi tetiklemez; Vercel hızlı kapıları (qa, tsc, rota, veri testleri)
    # her derlemede koşturur. PR'lar (`pull_request`) bu süzgeçten ETKİLENMEZ ve
    # kod içeren her push tam koşar: paths-ignore yalnızca TÜM değişen dosyalar
    # eşleşirse atlar.
    paths-ignore:
      - 'data/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: interactions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  production:
    runs-on: ubuntu-latest
    # The build regenerates the whole site (match pages, both news feeds,
    # every English page) and then runs verify-production with three
    # browser gates. On a 2-vCPU runner that grew past the old 45-minute
    # ceiling and the job started being cancelled mid-build — the gates
    # never reported, so the ceiling verified nothing. Nothing is skipped
    # here; the same checks are simply allowed to finish.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # TARAYICI ÖNBELLEĞİ. Chromium indirmesi her koşuda sıfırdan yapılıyordu
      # (~1-2 dakika × koşu başına). Sürüm anahtarı package-lock.json'dan
      # geliyor, yani Playwright yükseltilince önbellek kendiliğinden
      # tazeleniyor; --with-deps'in kurduğu sistem kütüphaneleri önbelleğe
      # girmediği için o adım her koşuda yine çalışıyor.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # postbuild gates success on lint, types, all routes and real clicks.
      #
      # GENİŞLİK KÜMESİNİ PR'DA DARALTMAK DENENDİ VE GERİ ALINDI. 20.09.2026'da
      # bu adım PR'larda `AUDIT_WIDTH=390,768,1440` ile koşturuldu; dokuz
      # genişlik yerine üç genişlik. Ölçüm, tasarrufun olmadığını gösterdi:
      #
      #   koşu 411 (3 genişlik, PR)   16:27:39 → 17:15:30 = 47,9 dk
      #   koşu 404 (9 genişlik, main) 13:11    → 13:59    = ~48 dk
      #   koşu 402 (9 genişlik, PR)   12:08    → 12:58    = ~50 dk
      #
      # Sebebi adım dökümünde görünüyor: `npm run build` 46:54 sürüyor ve bunun
      # ezici çoğunluğu SİTENİN YENİDEN ÜRETİLMESİ; tıklanabilirlik denetimi bu
      # sürenin küçük bir dilimi. Yani daraltma, ölçülebilir bir dakika
      # kazandırmadan PR'ların denetlendiği genişlik sayısını azaltıyordu —
      # bedava olmayan bir kapsam kaybı. Tekrar denenecekse önce derleme
      # süresi ele alınmalı, denetim değil.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clickable-audit
          path: |
            outputs/clickable/
            outputs/interaction-routes.json
          retention-days: 14
