name: FutbolRadar Daily Health Check

# Günlük bakım: bayat maç kartlarını ve üç günden eski ticker öğelerini
# temizler (bu depoya commit'e dönüşür), sonra üretimdeki /api/daily-health-check
# uç noktasını (sır ile korunuyor) çağırarak sayfa erişilebilirliğini ve
# canlı skor gecikmesini ölçer. Neden ikisi ayrı: scripts/daily-health-check.mjs
# başlığındaki "neden 1-2 yerel, 3 uzak" notuna bakın.
#
# 05:05 TSİ SEÇİLDİ, 05:00 DEĞİL. match-analysis.yml TAM OLARAK 05:00 ve
# 05:20 TSİ'de (0 2 * * * / 20 2 * * *) main'e commit atıyor; aynı dakikada
# ikinci bir iş başlatmak yalnızca ci-commit-push.mjs'nin rebase-yeniden
# deneme mekanizmasını gereksiz yere zorlar. Beş dakikalık kayma, günlük
# tam güncellemenin verisi tazeyken bu kontrolün onun ARDINDAN çalışmasını
# da sağlıyor.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "5 2 * * *"

permissions:
  contents: write

concurrency:
  # main'e YAZAN HER İŞ AYNI KUYRUKTA. Ayrı gruplardayken bu iş ile saatlik
  # güncelleme aynı anda koşuyor, ikisi de üretilmiş dosyaları yazıyor ve
  # sonra gelen push çakışmaya düşüyordu; ci-commit-push.mjs çakışmada taraf
  # seçmediği için o koşunun çıktısı DÜŞÜYOR. 19 Eylül 20:40'tan 20 Eylül
  # öğlene kadar saatlik koşuların tamamı bu yüzden sessizce yazılamadı ve
  # site bitmiş maçları "oynanacak" göstermeye devam etti. Ortak grup, işleri
  # iptal etmeden sıraya koyar.
  group: futbolradar-production-update
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://www.futbolradar.com
      DAILY_HEALTH_CHECK_SECRET: ${{ secrets.DAILY_HEALTH_CHECK_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SIĞ KLON. Bu depo ~14.000 üretilmiş dosya taşıyor ve her saatlik CI
          # commit'i bunların büyük kısmına dokunuyor; tam geçmişi çekmek koşu
          # başına dakikalar sürüyordu ve private depoda o dakikalar
          # faturalanıyor. Bu işin geçmişe ihtiyacı yok: yalnızca güncel veriyi
          # okuyup üstüne yazıyor.
          #
          # 1 DEĞİL 20: scripts/ci-commit-push.mjs itme reddedilirse
          # `git fetch` + `git rebase origin/<dal>` yapıyor. Derinlik 1'de ortak
          # ata bulunamaz ve rebase düşer. 20 commit, otomatik koşuların arasına
          # giren sürüklenme için fazlasıyla yeterli bir tampon.
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint (scripts/qa.mjs)
        run: npm run lint

      - name: Run daily health check (cleanup + remote report)
        id: health
        continue-on-error: true
        run: node scripts/daily-health-check.mjs --apply

      - name: Verify published fixture pool
        id: fixtures
        continue-on-error: true
        run: node scripts/check-fixture-publication.mjs

      - name: Commit cleanup and report if anything changed
        if: always()
        run: |
          node scripts/ci-commit-push.mjs "ci(health): daily health check - stale match cards, ticker, latency report"

      - name: Preserve report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-health-check-${{ github.run_id }}
          path: data/daily-health-check-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail the workflow if a real check failed
        if: always() && (steps.health.outcome == 'failure' || steps.fixtures.outcome == 'failure')
        run: exit 1
