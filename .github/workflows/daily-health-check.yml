name: FutbolRadar Daily Health Check
on:
  schedule:
    # GÜNDE BİR (24.11.2026). Önceden saatlikti (`47 * * * *`) ve 2.000
    # dakikalık aylık Actions kotasının görünür bir payını yiyordu; kota
    # 9 Kasım'da bitince bütün işler runner alamadan düşmeye başladı.
    # Saatlik canlılık izi Vercel'deki /api/cron/health (aynı 47. dakika,
    # vercel.json) ile zaten tutuluyor; bu iş günlük özet ve bildirim için.
    # 07:47 UTC = 10:47 TSİ, saat başı kuyruğundan uzak.
    - cron: '47 7 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
  statuses: read
  issues: write
concurrency:
  group: futbolradar-operations-monitor
  cancel-in-progress: false
jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore operational observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/restore-operations-ledger.mjs
      - name: Check scheduler, published versions and TR/EN pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/monitor-operations.mjs
      - name: Observe Supabase and publish the bounded 24-hour cloud report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/cloud-watch.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operations-monitor
          path: |
            outputs/operations/monitor.json
            outputs/operations/cloud-watch.json
          retention-days: 90
      - name: Notify critical incident or recovery once
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/notify-operations.mjs
