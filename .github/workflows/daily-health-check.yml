name: FutbolRadar Daily Health Check
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: futbolradar-operations-monitor
  cancel-in-progress: false
jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore operational observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/restore-operations-ledger.mjs
      - name: Check scheduler, published versions and TR/EN pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/monitor-operations.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operations-monitor
          path: outputs/operations/monitor.json
          retention-days: 90
