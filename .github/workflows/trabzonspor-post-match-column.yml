name: Trabzonspor Post-Match Column

# MAÇ BİTER BİTMEZ ANALİZ — HEDEF: İLK 0–5 DAKİKA.
#
# Zincir tek koşuda tamamlanıyor: sağlayıcıdan bitiş doğrulaması ve maç
# dökümü → köşe yazısı → sayfalar → commit. Vercel commit'i görüp yalnızca
# değişen çıktıyı yayımlıyor.
#
# ── NEDEN SAĞLAYICIYA BU İŞ AKIŞI GİDİYOR ───────────────────────────────
#
# İlk sürüm yalnızca depodaki veriyi okuyordu ve veriyi saatlik iş akışı
# (match-analysis.yml) tazeliyordu. Ölçüldü: 19 Eylül'de saat 21:26'da,
# 20:00'de başlamış maç depoda hâlâ SCHEDULED ve skorsuzdu. Yani "maç
# bitince yayımla" zinciri, en iyi ihtimalle bir sonraki saat başını
# bekliyordu — 0–5 dakika hedefiyle bağdaşmaz. Bu yüzden bitiş
# doğrulamasını bu iş akışı KENDİSİ yapıyor.
#
# `sync-live-fixtures.mjs --apply` yalnızca skor değil, maç dökümünü de
# (olay akışı, diziliş, istatistik, oyuncu satırları) çekiyor; yani yazının
# ihtiyaç duyduğu her bölüm tek adımda geliyor.
#
# ── 0–5 DAKİKA NEREYE KADAR GARANTİ EDİLEBİLİR ──────────────────────────
#
# Edilemez, ve bunu iş akışının kendisi söylemeli: GitHub `schedule` için
# en sık aralık BEŞ DAKİKADIR ve kuyruk yoğunken gecikir (bu depoda saat
# başına sabitlenmiş koşuların saatlerce geciktiği ölçüldü — bkz.
# docs/scheduled-updates.md). Yani cron ile ulaşılabilecek en iyi değer
# "maçın bitişinden sonraki ilk koşu", tipik olarak 0–10 dakika.
# Gerçekten garantili bir 0–5 dakika, dışarıdan `workflow_dispatch`
# tetikleyen daima açık bir zamanlayıcı ister; bu iş akışı o tetiği de
# kabul ediyor (aşağıdaki workflow_dispatch).
#
# Koşu ucuz: bitmiş maç yoksa betik ilk saniyede "yapacak iş yok" deyip
# çıkıyor ve hiçbir dosya değişmiyor.

on:
  schedule:
    # Beş dakikada bir, Türkiye maç saatlerini kapsayan pencerede
    # (16:00–03:00 Europe/Istanbul). Saat başındaki kuyruk yoğunluğundan
    # kaçmak için :02 ofsetiyle başlıyor.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 13-23,0 * * *"
  workflow_dispatch:
    inputs:
      match_id:
        description: "Belirli bir maç kimliği (boşsa son bitmiş Trabzonspor maçı seçilir)"
        required: false
        default: ""
      window_hours:
        description: "Kaç saat geriye bakılsın (varsayılan 36)"
        required: false
        default: "36"
      skip_provider:
        description: "true ise sağlayıcı senkronu atlanır, yalnızca depodaki veri kullanılır"
        required: false
        default: "false"
      dry_run:
        description: "true ise hiçbir şey yazılmaz, yalnızca çıktı günlüğe basılır"
        required: false
        default: "false"

permissions:
  contents: write

# Üretim güncellemesiyle AYNI grup: iki iş akışı da depoya yazıyor.
concurrency:
  group: futbolradar-production-update
  cancel-in-progress: false

jobs:
  column:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
      APIFOOTBALL_API_BASE_URL: ${{ secrets.APIFOOTBALL_API_BASE_URL }}
      APIFOOTBALL_LEAGUE_ID: ${{ secrets.APIFOOTBALL_LEAGUE_ID }}
      APIFOOTBALL_SEASON: ${{ secrets.APIFOOTBALL_SEASON }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout current production data
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # KAPI 0: üretim mantığının kendi denetimi. Bozuk bir üreticiden çıkan
      # metni yayımlamaktansa hiç yayımlamamak doğru.
      - name: Verify column generator
        run: node scripts/test-trabzonspor-post-match-column.mjs

      # BİTİŞ DOĞRULAMASI SAĞLAYICIDAN. Skor, olay akışı, diziliş,
      # istatistik ve oyuncu satırları bu adımda geliyor. Anahtar yoksa
      # betik bunu açıkça söyleyip çıkar; zincir depodaki veriyle devam
      # eder ve kapılar zaten eksik veriyi yakalar.
      - name: Sync live fixtures from provider
        if: inputs.skip_provider != 'true'
        continue-on-error: true
        run: node scripts/sync-live-fixtures.mjs --apply

      # Oyuncu–maç zaman serisi: transfer performansı karşılaştırmasının
      # tek kaynağı. Her bitmiş maçtan sonra biraz daha doluyor.
      - name: Accumulate player match history
        run: node scripts/harvest-player-match-history.mjs --apply

      - name: Detect finished Trabzonspor match
        id: detect
        shell: bash
        env:
          MATCH_ID: ${{ inputs.match_id }}
          WINDOW: ${{ inputs.window_hours }}
        run: |
          set -o pipefail
          ARGS=""
          [ -n "${MATCH_ID}" ] && ARGS="--match=${MATCH_ID}"
          [ -n "${WINDOW}" ] && ARGS="${ARGS} --window=${WINDOW}"
          node scripts/generate-trabzonspor-post-match-column.mjs ${ARGS} 2>&1 | tee detect.log
          if grep -q "Hiçbir şey üretilmedi" detect.log; then
            echo "found=false" >> "${GITHUB_OUTPUT}"
          else
            echo "found=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Generate and publish column
        if: steps.detect.outputs.found == 'true' && inputs.dry_run != 'true'
        shell: bash
        env:
          MATCH_ID: ${{ inputs.match_id }}
          WINDOW: ${{ inputs.window_hours }}
        run: |
          set -o pipefail
          ARGS="--apply"
          [ -n "${MATCH_ID}" ] && ARGS="${ARGS} --match=${MATCH_ID}"
          [ -n "${WINDOW}" ] && ARGS="${ARGS} --window=${WINDOW}"
          node scripts/generate-trabzonspor-post-match-column.mjs ${ARGS} 2>&1 | tee column.log
          # Sayfalar, ana sayfa vitrini, liste, sitemap ve İngilizce sürüm.
          node scripts/generate-column-pages.mjs
          # İki dilin karşılıklı bağlantısı.
          node scripts/inject-hreflang.mjs
          # Maç ve maç raporu sayfalarından yazıya köprü.
          node scripts/inject-match-column-link.mjs
          node scripts/generate-search-index.mjs

      - name: Commit published column
        if: steps.detect.outputs.found == 'true' && inputs.dry_run != 'true'
        run: >-
          node scripts/ci-commit-push.mjs
          "ci(column): Trabzonspor maç sonu analizi"

      - name: Preserve run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trabzonspor-column-${{ github.run_id }}
          path: |
            detect.log
            column.log
          if-no-files-found: ignore
          retention-days: 14
