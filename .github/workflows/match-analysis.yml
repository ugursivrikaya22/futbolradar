name: Match Analysis Automation

# The only GitHub Actions workflow in this repository — there was no
# pre-existing data-update automation to attach to (data/matches.json is
# hand-curated, and no live fixture-sync script exists yet). Two jobs:
#
# 1. update-match-analyses: the full pipeline, twice a day. Safe order —
#    league/team config -> API-Football preflight -> squad sync -> player
#    canonical merge -> player validation -> match analysis generation ->
#    match analysis validation -> build (static pages/sitemap/public sync) ->
#    QA -> tests -> commit only if something changed.
#
#    Kadro/oyuncu senkron adımları ön kontrole bağlıdır: APIFOOTBALL_API_KEY
#    secret'i tanımlı değilse bu adımlar HİÇ çalışmaz (körlemesine koşup
#    sessizce no-op etmez) ve koşu özetinde tam olarak neyin eksik olduğu
#    yazar. Secret eklendiği anda kendiliğinden gerçek veriyle çalışırlar;
#    lig kimliği tanımlı değilse sağlayıcının /leagues uç noktasından
#    çözülüp önbelleğe alınır. Hiçbir durumda sahte kadro üretilmez.
#
# 2. live-refresh: a separate, lighter, more frequent job (every 5 minutes).
#    It refreshes official lineups before kickoff, syncs finished results and
#    regenerates match reports, so a match that just ended gets its final
#    analysis into the static output within minutes instead of waiting for
#    the next daily run. Each script limits its own scope (the lineup refresh
#    only touches fixtures inside a 180-minute pre-kickoff window, capped at
#    20 per run), so frequent runs are not "aggressive polling" — the scripts
#    decide whether there is anything to do and no-op otherwise.
#
# Every step in both jobs is a real gate: a failed step stops the job before
# the commit step ever runs, so a bad sync/validation can never publish
# partial data or overwrite good data with nothing.

on:
  schedule:
    # 08:00 Europe/Istanbul - morning fixture/squad/analysis refresh.
    - cron: "0 5 * * *"
    # 16:00 Europe/Istanbul - a few hours ahead of typical evening kickoffs.
    - cron: "0 13 * * *"
    # Canlı döngü: 5 dakikada bir. Maç biten karşılaşmanın sonucunu, olay
    # akışını ve maç raporunu tazeler. 5 dakika GitHub Actions'ın izin
    # verdiği en sık aralıktır ve zamanlanmış işler yoğun saatlerde birkaç
    # dakika gecikebilir; bu yüzden "maç sonu analizi 30-60 saniyede hazır"
    # hedefi STATİK sayfalarda değil, açık sayfada çalışan istemci
    # yoklamasıyla karşılanır (app.js: MATCH_DETAIL_POLL_MS ve
    # MATCH_FINAL_ANALYSIS_DELAY_MS). Buradaki iş, sayfayı o an açmayan
    # ziyaretçiler ve arama motorları için statik çıktıyı tazeler.
    # Script kendi penceresine baktığı için çoğu koşuda hiçbir şey yapmaz.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: match-analysis-automation
  cancel-in-progress: false

jobs:
  update-match-analyses:
    if: github.event.schedule != '*/5 * * * *'
    runs-on: ubuntu-latest
    # Anahtar iş düzeyinde: `secrets` bağlamı adım `if`inde okunamaz, `env`
    # okunabilir. Tanımsız secret boş dizeye açılır.
    env:
      APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Fikstür takvimi: TheSportsDB ücretsiz/anahtarsız çalışır, bu yüzden
      # secret olmadan da gerçek maç listesi üretir. Script kendi boş-çekim
      # ve %50 düşüş korumalarına sahip; hata verirse iş burada durur ve
      # eski takvim dosyası olduğu gibi kalır.
      - name: Sync fixture calendar (Süper Lig takımlarının maç takvimi)
        run: node scripts/sync-fixture-calendar.mjs --apply

      # Kadro senkronu API-Football anahtarına ihtiyaç duyar. Anahtar Vercel'de
      # tanımlı ama GitHub Actions ayrı bir ortamdır: secret buraya
      # geçirilmediği sürece kadrolar boş kalır.
      #
      # Ön kontrol, senkrondan ÖNCE karar verir ve eksikse tek tek hangi
      # değişkenin eksik olduğunu koşu özetine yazar. continue-on-error:
      # eksik secret yüzünden maç sonuçları ve site derlemesi durmamalı —
      # ama kadro adımları da körlemesine koşmamalı, o yüzden aşağıdaki
      # adımlar bu adımın çıktısına bağlı.
      #
      # KAPI YAPISI GEREĞİ GÜVENLİ TARAFA DÜŞER. Üç durumun üçü de doğru:
      #   hazır      -> script 0 ile çıkar, ready=true yazılır  -> senkron koşar
      #   eksik      -> script 1 ile çıkar, ready=false yazılır -> senkron atlanır
      #   çöker      -> hiçbir çıktı yazılmaz, ready boş kalır  -> senkron atlanır
      # Yani çıktının kaydedilmediği her senaryoda karşılaştırma 'true' ile
      # eşleşmez ve kadro senkronu çalışmaz. Hiçbir arıza "körlemesine koş"
      # yönüne düşemez; sahte veri üretilmez.
      - name: Preflight API-Football configuration
        id: apifootball
        continue-on-error: true
        env:
          APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
          APIFOOTBALL_LEAGUE_ID: ${{ secrets.APIFOOTBALL_LEAGUE_ID }}
          APIFOOTBALL_SEASON: ${{ secrets.APIFOOTBALL_SEASON }}
        # --probe olmadan kapı yalnızca anahtarın VAR OLDUĞUNU doğrular.
        # İptal edilmiş ya da limiti dolmuş bir anahtar kapıyı açar, kadro
        # senkronu ilk çağrıda düşer ve aynı zincirdeki maç sonucu senkronunu
        # ve derlemeyi de yanında götürürdü. Lig kimliği env'den/önbellekten
        # geldiğinde çözümleme ağa hiç çıkmadığı için tek doğrulama noktası
        # budur. Maliyeti günde iki koşuda birkaç çağrı.
        run: node scripts/preflight-api-football.mjs --resolve --probe

      # continue-on-error: bu adım artık sağlayıcı kaynaklı geçici sorunlarda
      # da sıfırdan farklı kod döndürüyor (boş çekim, lig kimliği uyuşmazlığı,
      # takım sayısında ani düşüş). Bunlar DOĞRU davranış — hiçbiri veri
      # yazmıyor — ama zincirin geri kalanı maç sonuçları ve site derlemesi.
      # Bir kadro senkronu hıçkırığının bütün sitenin güncellenmesini
      # durdurması, engellemeye çalıştığı sorundan daha pahalı. Adım
      # arayüzde başarısız görünür, veri yazılmaz, zincir devam eder.
      - name: Sync Süper Lig teams and squads
        if: steps.apifootball.outputs.ready == 'true'
        continue-on-error: true
        env:
          APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
          APIFOOTBALL_LEAGUE_ID: ${{ secrets.APIFOOTBALL_LEAGUE_ID }}
          APIFOOTBALL_SEASON: ${{ secrets.APIFOOTBALL_SEASON }}
        run: node scripts/sync-super-lig-squads.mjs --apply

      # Bu adım tamamen çevrimdışı: data/super-lig-squads.json'ı
      # data/players.json ile birleştirir, hiçbir sağlayıcı çağrısı yapmaz
      # ve anlık görüntü yoksa kendi kendine no-op eder. Ön kontrole
      # bağlanması yanlış bir bağımlılık olurdu — anahtar geçici olarak
      # yokken önceki koşudan gelen kadroların birleştirilmesini engellerdi.
      - name: Merge synced squads into canonical player data
        run: node scripts/sync-canonical-players.mjs --apply

      - name: Validate team/player data
        run: |
          node scripts/validate-player-data.mjs
          node scripts/validate-transfer-data.mjs
          node scripts/validate-football-coverage.mjs

      - name: Generate upcoming match analyses
        run: node scripts/generate-match-analyses.mjs --days=3 --apply

      - name: Refresh official lineups for fixtures inside the pre-kickoff window
        env:
          APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
        run: node scripts/refresh-official-lineups.mjs --apply

      # Kimlik eşleştirmesi sonuç senkronundan ÖNCE koşmalı: sync, maçı
      # API-Football fixture id'siyle sorguluyor.
      - name: Backfill missing API-Football fixture ids
        env:
          APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
        run: node scripts/backfill-provider-ids.mjs --apply

      - name: Sync finished match results (statistics, events, lineups)
        env:
          APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
        run: node scripts/sync-match-results.mjs --apply

      # MAÇ SONU ZENGİNLEŞTİRME — ŞİMDİLİK YALNIZCA KURU KOŞU.
      #
      # Bu adım BİLEREK `--apply` TAŞIMIYOR. Amacı veri yazmak değil,
      # boru hattını gerçek kimlik doğrulamalı yanıtlarla KANITLAMAK:
      # hangi kürasyonlu maç hangi sağlayıcı fikstürüne bağlanıyor, hangi
      # bölüm doluyor, hangisi sağlayıcı kapsamı yüzünden boş kalıyor.
      #
      # Bağlama doğruluğu göz kontrolü gerektiriyor: yanlış fikstüre
      # bağlanmak, başka bir karşılaşmanın gollerini ve dizilişini bu maçın
      # raporuna yazmak demek. Çözümleme skor doğrulaması yapıyor ama
      # kanıtı görmeden yazmaya geçmek, o kontrolü atlamak olurdu.
      # Günlükler temiz çıktığında `--apply` ayrı bir kararla eklenir.
      #
      # Anahtar dışında env yok: maç sonu uç noktalarının hepsi fikstür
      # kimliğiyle çalışıyor (/fixtures/events, /lineups, /statistics,
      # /players), lig kimliği gerekmiyor.
      #
      # continue-on-error: diğer sağlayıcı adımlarıyla aynı gerekçe —
      # kuru koşunun başarısızlığı hiçbir veriyi bozmaz ve site
      # derlemesini durdurmamalı.
      - name: Verify post-match enrichment (dry run, no writes)
        if: steps.apifootball.outputs.ready == 'true'
        continue-on-error: true
        env:
          APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
        run: npm run enrich:post-match

      # Geriye dönük tamamlama: canlı döngünün kaçırdığı ya da o sırada
      # verisi eksik olan maçlar. Öncelik sırası son 4 gün → Türk kulüpleri
      # → Süper Lig → Avrupa kupaları → arşiv. Tekrar çalıştırılabilir:
      # zaten tam olan analiz yeniden üretilmez.
      # Biten maçların eksik dökümünü sağlayıcıdan tamamlar (oyuncu ve takım
      # istatistikleri, kadrolar, değişiklikler). Anahtar yoksa adım hiç
      # koşmaz — sessizce no-op etmek yerine atlandığı görünür.
      - name: Refetch finished matches from provider
        if: env.APIFOOTBALL_API_KEY != ''
        run: node scripts/refetch-finished-matches.mjs --apply --limit=25 --days=4

      # Oynanmış maçların maç ÖNCESİ analiz kayıtları bayattır: "Analizi
      # hazır" sayacını şişirir ve maç sonrası analizle çelişir.
      #
      # SİLMİYOR, YALNIZCA BİLDİRİYOR. Otomatik silme, üretilmiş gerçek
      # analiz kaydını kimse bakmadan yok eder. Hangi kaydın neden bayat
      # sayıldığı günlüğe düşer; silme kararı insana bırakılır
      # (`--apply` ile elle çalıştırılır).
      - name: Report stale pre-match analyses (read-only)
        run: node scripts/prune-stale-match-analyses.mjs

      - name: Backfill missing post-match analyses
        run: node scripts/backfill-post-match-analyses.mjs --apply --limit=40

      - name: Validate match analyses
        run: node scripts/validate-match-analyses.mjs

      - name: Build static site (pages, sitemap, public mirrors)
        run: npm run build

      - name: QA
        run: npm run qa

      - name: Tests
        run: npm test

      - name: Commit changes if any
        run: |
          # Commit'in yazarı repo sahibinin GitHub hesabı olmalı. Vercel,
          # deploy'u tetikleyen commit'in yazarını bir GitHub hesabına eşler
          # ve o hesabın projeye katkı erişimi yoksa dağıtımı reddeder; Hobby
          # planı özel repolarda ek üye kabul etmediği için "futbolradar-bot"
          # gibi ayrı bir kimlikle atılan her commit dağıtımı bloke eder.
          # Bu adres ugursivrikaya22 hesabının GitHub noreply adresidir
          # (kullanıcı kimliği 295430257), bu yüzden commit doğrudan o hesaba
          # atfedilir ve gizli bir e-posta sızdırmaz.
          git config user.name "ugursivrikaya22"
          git config user.email "295430257+ugursivrikaya22@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "ci(matches): automate fixture and match analysis updates"
            git push
          else
            echo "No meaningful changes to commit."
          fi

  live-refresh:
    if: github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    # Anahtar iş düzeyinde tanımlanır ki adım koşullarında okunabilsin:
    # `secrets` bağlamı adım `if`inde kullanılamaz, `env` kullanılabilir.
    # Tanımsız bir secret boş dizeye açılır, dolayısıyla karşılaştırma
    # doğru çalışır.
    env:
      APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Sağlayıcıya ihtiyaç duyan üç adım anahtar yokken açıkça ATLANIR.
      # Daha önce koşup sessizce hiçbir şey yapmıyorlardı; koşu yeşil
      # görünüyor ama neden bir şey olmadığı görünmüyordu. Burada ön kontrol
      # KULLANILMIYOR: bu iş beş dakikada bir koşuyor, günde 288 kez ağa
      # çıkan bir doğrulama kotayı boşa harcardı. Anahtarın kullanılabilir
      # olup olmadığı günlük işin ön kontrolünde bir kez sınanıyor; buradaki
      # kontrol yalnızca "tanımlı mı" sorusunu ücretsiz yanıtlıyor.
      - name: Refresh official lineups
        if: env.APIFOOTBALL_API_KEY != ''
        run: node scripts/refresh-official-lineups.mjs --apply

      # Maç biter bitmez sonucu çekip raporu üretir. Beş dakikalık döngüde
      # olması, biten bir maçın raporunun ertesi güne kalmamasını sağlar.
      - name: Backfill missing API-Football fixture ids
        if: env.APIFOOTBALL_API_KEY != ''
        run: node scripts/backfill-provider-ids.mjs --apply

      - name: Sync finished match results
        if: env.APIFOOTBALL_API_KEY != ''
        run: node scripts/sync-match-results.mjs --apply

      # Analiz deposu rapor sayfalarından ÖNCE üretilir: sayfalar depoyu
      # okuyor. Parmak izi sayesinde girdisi değişmemiş maç yeniden
      # üretilmez, bu yüzden beş dakikalık döngüde koşması ucuz.
      - name: Regenerate post-match analysis store
        run: node scripts/generate-post-match-reports.mjs --apply

      - name: Regenerate match reports
        run: node scripts/generate-post-match-pages.mjs

      - name: Validate match analyses
        run: node scripts/validate-match-analyses.mjs

      - name: Match report generation tests
        run: node scripts/test-match-report-generation.mjs

      # Rapor üreteci sayfayı sıfırdan yazar; paylaşılan başlık/haber bandı,
      # tema önyüklemesi ve GA4 etiketi ayrı adımlarda enjekte edilir. Bu
      # adımlar atlandığında yeniden üretilen her sayfa onları sessizce
      # kaybeder — iki kez yaşandı (önce bant ve GA4, sonra tema önyüklemesi).
      # Adımlar artık tek bir npm betiğinde toplu: yeni bir enjeksiyon
      # eklendiğinde burada ayrıca hatırlamak gerekmiyor.
      - name: Reapply shared layout, theme boot and analytics
        run: npm run postprocess

      - name: Sync public data mirror
        run: node scripts/sync-public-assets.mjs

      - name: Commit changes if any
        run: |
          # Commit'in yazarı repo sahibinin GitHub hesabı olmalı. Vercel,
          # deploy'u tetikleyen commit'in yazarını bir GitHub hesabına eşler
          # ve o hesabın projeye katkı erişimi yoksa dağıtımı reddeder; Hobby
          # planı özel repolarda ek üye kabul etmediği için "futbolradar-bot"
          # gibi ayrı bir kimlikle atılan her commit dağıtımı bloke eder.
          # Bu adres ugursivrikaya22 hesabının GitHub noreply adresidir
          # (kullanıcı kimliği 295430257), bu yüzden commit doğrudan o hesaba
          # atfedilir ve gizli bir e-posta sızdırmaz.
          git config user.name "ugursivrikaya22"
          git config user.email "295430257+ugursivrikaya22@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "ci(matches): refresh live results and match reports"
            git push
          else
            echo "No meaningful changes to commit."
          fi
