name: FutbolRadar Scheduled Updates

# The site is static and its durable data lives in this repository. GitHub
# Actions is therefore the scheduler and writer; each successful commit causes
# Vercel to deploy only the changed output. There is deliberately no public
# cron HTTP endpoint for visitors to discover or invoke.
on:
  schedule:
    # 05:00 Europe/Istanbul (UTC+3) - comprehensive daily refresh.
    - cron: "0 2 * * *"
    # Beginning of every hour except 02:00 UTC, when the full job owns the lock.
    - cron: "0 0-1,3-23 * * *"
  workflow_dispatch:
    inputs:
      update_type:
        description: Update pipeline to run
        required: true
        default: full
        type: choice
        options:
          - full
          - hourly
      force:
        description: Ignore the same-window duplicate guard
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

# One shared group covers both schedules and authorized manual runs. A full job
# is never cancelled by an hourly run, and no two jobs can write the same files.
concurrency:
  group: futbolradar-production-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
      APIFOOTBALL_API_BASE_URL: ${{ secrets.APIFOOTBALL_API_BASE_URL }}
      APIFOOTBALL_LEAGUE_ID: ${{ secrets.APIFOOTBALL_LEAGUE_ID }}
      APIFOOTBALL_SEASON: ${{ secrets.APIFOOTBALL_SEASON }}
      APIFOOTBALL_COUNTRY: Turkey
      THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
      FOOTBALL_NEWS_FEEDS: ${{ secrets.FOOTBALL_NEWS_FEEDS }}
      # Supabase veri katmanı için — tanımlı değilse `supabase-sync` adımı
      # açıkça "atlandı" der ve geri kalan güncelleme normal çalışır
      # (services/supabase/env.js, scripts/supabase-ingest.mjs).
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      HOME_POLL_IP_SALT: ${{ secrets.HOME_POLL_IP_SALT }}
      # GitHub issues this short-lived token only inside the authenticated run.
      # The orchestrator validates the event, repository and token presence.
      FUTBOLRADAR_AUTOMATION_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current production data
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve update type
        id: update_type
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_TYPE: ${{ inputs.update_type }}
          MANUAL_FORCE: ${{ inputs.force }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            update_type="${MANUAL_TYPE}"
          elif [[ "${SCHEDULE}" == "0 2 * * *" ]]; then
            update_type="full"
          else
            update_type="hourly"
          fi
          echo "type=${update_type}" >> "${GITHUB_OUTPUT}"
          if [[ "${MANUAL_FORCE}" == "true" ]]; then
            echo "force=--force" >> "${GITHUB_OUTPUT}"
          else
            echo "force=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run monitored update pipeline
        id: update
        continue-on-error: true
        shell: bash
        env:
          UPDATE_TYPE: ${{ steps.update_type.outputs.type }}
          FORCE_FLAG: ${{ steps.update_type.outputs.force }}
        run: |
          set -o pipefail
          node scripts/run-scheduled-update.mjs --type="${UPDATE_TYPE}" --ci-guard ${FORCE_FLAG} 2>&1 | tee scheduled-update.log

      - name: Commit valid changes and monitoring status
        if: steps.update.outcome == 'success'
        shell: bash
        env:
          UPDATE_TYPE: ${{ steps.update_type.outputs.type }}
        run: |
          node scripts/ci-commit-push.mjs "ci(update): ${UPDATE_TYPE} automatic FutbolRadar refresh"

      - name: Preserve structured run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futbolradar-${{ steps.update_type.outputs.type }}-${{ github.run_id }}
          path: |
            scheduled-update.log
            data/update-status.json
          retention-days: 30

      - name: Fail workflow after status capture
        if: always() && steps.update.outcome == 'failure'
        shell: bash
        run: exit 1
