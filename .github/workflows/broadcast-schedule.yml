# YAYIN KANALI TARAMASI — HER GÜN, MAÇ GÜNÜNÜ BEKLEMEDEN.
#
# NEDEN VAR. Yayın kanalı bilgisi siteye maç günü, çoğu zaman maç
# başladıktan sonra düşüyordu. Okuyucunun sorusu ise bir gün önce
# soruluyor: "yarın maç kaçta, hangi kanalda". Bu iş akışı yarının
# öncelikli maçlarını her sabah tarar ve kanalı yayıncıların KENDİ
# akışlarından doğrular.
#
# NEDEN GÜN İÇİNDE TEKRAR KOŞAR. Yayın akışı sabah kesinleşmiş olmuyor:
# kanal ataması ve maç saati gün içinde değişebiliyor. Tek bir sabah
# koşusu, öğleden sonra değişen bir kanalı ertesi güne kadar yanlış
# bırakırdı. Çıktı dosyası her koşuda sıfırdan yazıldığı için değişiklik
# kendiliğinden düzelir; ayrıca betik değişeni günlüğe yazar.
#
# NEDEN DÜŞMESİ SORUN DEĞİL. Betik ağ hatasında bile 0 ile çıkar ve
# çıktıyı olduğu gibi bırakır; sayfalar son bilinen doğrulamayı ya da
# "Yayın bilgisi bekleniyor" satırını gösterir. Yani taramanın kırılması
# yanlış kanal değil, görünür bir eksik üretir.
name: broadcast-schedule

on:
  # Scheduled scan now belongs to match-analysis.yml (05/11/15/19 Istanbul).
  workflow_dispatch:
    inputs:
      days:
        description: "Kaç gün ileri taransın (varsayılan 2 = bugün + yarın)"
        required: false
        default: "2"
permissions:
  contents: write

concurrency:
  # main'e YAZAN HER İŞ AYNI KUYRUKTA. Ayrı gruplardayken bu iş ile saatlik
  # güncelleme aynı anda koşuyor, ikisi de üretilmiş dosyaları yazıyor ve
  # sonra gelen push çakışmaya düşüyordu; ci-commit-push.mjs çakışmada taraf
  # seçmediği için o koşunun çıktısı DÜŞÜYOR. 19 Eylül 20:40'tan 20 Eylül
  # öğlene kadar saatlik koşuların tamamı bu yüzden sessizce yazılamadı ve
  # site bitmiş maçları "oynanacak" göstermeye devam etti. Ortak grup, işleri
  # iptal etmeden sıraya koyar.
  group: site-yuku
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bağımlılıklar
        run: npm ci --no-audit --no-fund

      - name: Yayın akışlarını tara
        run: |
          node scripts/scan-broadcast-schedule.mjs --apply --days=${{ github.event.inputs.days || '2' }}

      - name: Sayfaları yeniden üret
        run: |
          node scripts/generate-broadcast-schedule-page.mjs
          node scripts/prerender-core-pages.mjs
          node scripts/generate-en-pages.mjs

      - name: Denetimler
        run: |
          node scripts/test-broadcast-schedule.mjs
          node scripts/test-broadcast-verifications.mjs
          node scripts/test-source-links.mjs

      - name: Değişikliği gönder
        run: |
          node scripts/ci-commit-push.mjs "ci(broadcast): günlük yayın kanalı taraması"
