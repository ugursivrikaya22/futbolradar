name: english-news

# Manual only: scheduled discovery disabled to reduce duplicate publishing/builds.
on:
  workflow_dispatch:

concurrency:
  # main'e YAZAN HER İŞ AYNI KUYRUKTA. Ayrı gruplardayken bu iş ile saatlik
  # güncelleme aynı anda koşuyor, ikisi de üretilmiş dosyaları yazıyor ve
  # sonra gelen push çakışmaya düşüyordu; ci-commit-push.mjs çakışmada taraf
  # seçmediği için o koşunun çıktısı DÜŞÜYOR. 19 Eylül 20:40'tan 20 Eylül
  # öğlene kadar saatlik koşuların tamamı bu yüzden sessizce yazılamadı ve
  # site bitmiş maçları "oynanacak" göstermeye devam etti. Ortak grup, işleri
  # iptal etmeden sıraya koyar.
  group: futbolradar-production-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Akışı tazele
        run: node scripts/sync-english-news.mjs

      - name: Sözleşme denetimleri
        # Sayfa üretmeden ÖNCE: akış bozulduysa bozuk veriden sayfa
        # üretip yayına itmek, hiç güncellememekten kötüdür.
        run: |
          node scripts/test-editorial-status.mjs
          node scripts/test-english-news.mjs

      - name: Sayfaları üret
        run: node scripts/generate-en-news-pages.mjs

      - name: Değişiklikleri işle
        # Blok skaler ŞART: commit mesajı ": " içeriyor ve tırnaksız bir
        # YAML skalerinde bu dizi eşleme ayracı sayılıp dosyayı
        # ayrıştırılamaz hâle getiriyor (scripts/qa.mjs bunu denetliyor).
        run: |
          node scripts/ci-commit-push.mjs "ci(english-news): otomatik İngilizce haber tazelemesi"
