name: Günlük veri güncelleme
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Veriyi çek
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: npm run fetch
      - name: Değişikliği commitle
        run: |
          git config user.name "futbolradar-bot"
          git config user.email "bot@futbolradar"
          git add data/matches.json
          git diff --cached --quiet || git commit -m "Günlük veri güncellemesi"
          git push
