name: Günlük veri güncelleme
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Veriyi çek
        run: node scripts/fetch-thesportsdb.mjs
      - name: Maç sayfalarını üret
        run: node scripts/generate-pages.mjs
      - name: Maç sonuçlarını üret
        run: node scripts/generate-results.mjs
      - name: Değişikliği commitle
        run: |
          git config user.name "futbolradar-bot"
          git config user.email "bot@futbolradar"
          git add data/matches.json mac mac-sonucu sitemap.xml
          git diff --cached --quiet || git commit -m "Günlük veri, maç sayfaları ve sonuçlar"
          git pull --rebase origin main || true
          git push
